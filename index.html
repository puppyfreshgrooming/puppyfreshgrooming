<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puppy Fresh Grooming | Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --marsh: #2F4739;
    --marsh-dark: #223228;
    --sand-light: #F8F3EA;
    --clay: #E08E6D;
    --clay-dark: #C97650;
    --teal: #6E9E8C;
    --ink: #24211D;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:
      radial-gradient(ellipse at 20% 15%, rgba(110,158,140,0.35), transparent 55%),
      radial-gradient(ellipse at 85% 85%, rgba(224,142,109,0.22), transparent 50%),
      var(--marsh);
    color: var(--sand-light);
    font-family: 'Work Sans', sans-serif;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    padding: 2rem;
  }
  .wrap{ max-width: 40rem; }
  .mark{
    width:64px; height:64px; border-radius:50%;
    background: var(--sand-light);
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 1.6rem;
  }
  .mark svg{ width:32px; height:32px; color: var(--marsh); }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:0.75rem;
    letter-spacing:0.16em; text-transform:uppercase; color: var(--clay);
  }
  h1{
    font-family:'Fraunces', serif; font-weight:600;
    font-size: clamp(2.4rem, 6vw, 4rem); line-height:1.05;
    margin: 1rem 0 1.2rem;
  }
  h1 em{ font-style:italic; color: var(--clay); font-weight:500; }
  p.lede{
    font-size: 1.05rem; line-height:1.6; color: rgba(248,243,234,0.78);
    max-width: 30rem; margin: 0 auto;
  }
  .contact{
    margin-top: 2.4rem; display:flex; gap:1.5rem; justify-content:center; flex-wrap:wrap;
  }
  .contact a{
    color: var(--sand-light); text-decoration:none;
    font-family:'IBM Plex Mono', monospace; font-size:0.85rem;
    border-bottom: 1px solid rgba(248,243,234,0.35);
    padding-bottom: 2px;
  }
  .contact a:hover{ border-color: var(--clay); }
  .location{
    margin-top: 2rem; font-family:'IBM Plex Mono', monospace;
    font-size: 0.78rem; letter-spacing:0.08em; text-transform:uppercase;
    color: rgba(248,243,234,0.55);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="15" r="3.2"/>
        <circle cx="6" cy="7" r="1.8"/>
        <circle cx="18" cy="7" r="1.8"/>
        <circle cx="4.5" cy="12.5" r="1.6"/>
        <circle cx="19.5" cy="12.5" r="1.6"/>
      </svg>
    </div>
    <span class="eyebrow">Puppy Fresh Grooming</span>
    <h1>Something <em>fresh</em> is on the way.</h1>
    <p class="lede">We're putting the finishing touches on our new site. In the meantime, feel free to reach out to book a grooming appointment.</p>
    <div class="contact">
      <a href="mailto:puppyfreshgrooming@gmail.com">puppyfreshgrooming@gmail.com</a>
    </div>
    <div class="location">Mt Pleasant, South Carolina</div>
  </div>
</body>
</html>
